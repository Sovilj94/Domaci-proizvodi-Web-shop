# Render Blueprint — E piljara API, besplatni TEST deploy (vidi DEPLOY.md).
# Baza je na Neonu, ne na Render Postgresu (free Render baza se briše nakon 30 dana).
# Vrijednosti sa `sync: false` Render traži pri prvom kreiranju Blueprinta; u repou su prazne.
services:
  - type: web
    name: epiljara-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    # Deploy ide samo sa main: svaki push na main = novi deploy, ostale grane se ignorišu.
    branch: main
    autoDeploy: true
    # Ne rebuildaj API kad se mijenja samo frontend ili dokumentacija.
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Render-ov proxy šalje X-Forwarded-For; bez ovoga svi posjetioci dijele jedan IP
      # i rate limit (10/min na login) ih blokira zajedno.
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"

      # --- Secrets ---
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__SigningKey
        sync: false

      # --- Frontend (Vercel) ---
      - key: CORS_ORIGINS        # npr. https://epiljara.vercel.app (više: odvojeno zarezom)
        sync: false
      - key: App__BaseUrl        # isti Vercel URL — linkovi u mejlovima
        sync: false

      # --- Start ---
      - key: RUN_MIGRATIONS      # "true" za prvi deploy (može ostati true na jednoj instanci)
        sync: false
      # Pravi admin nalog (ne demo admin123). Pravi se/ažurira na svakom startu.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD      # min. 8 znakova; promjena + restart = nova lozinka
        sync: false
      - key: ADMIN_NAME
        sync: false

      # --- Email. Free Render blokira SMTP (25/465/587), pa mejl ide preko Brevo HTTP API-ja.
      # Koraci (domen, SPF/DKIM, ključ) su u DEPLOY.md, „Mejlovi u produkciji". ---
      - key: Email__Transport    # "brevo" u produkciji; "smtp" samo za lokalni Mailpit
        value: brevo
      - key: Email__Brevo__ApiKey
        sync: false
      - key: Email__From         # adresa na domenu potvrđenom u Brevu
        sync: false
      - key: Email__FromName
        value: E piljara
      - key: Email__ReplyTo      # adresa koju neko čita — odgovori kupaca
        sync: false
