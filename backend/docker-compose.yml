# Local development stack for the E piljara backend.
#   docker compose up -d postgres   # just the database (run the API from the IDE)
#   docker compose up -d            # database + API in containers
services:
  postgres:
    image: postgres:16-alpine
    container_name: epiljara-postgres
    environment:
      POSTGRES_USER: epiljara
      POSTGRES_PASSWORD: epiljara_dev_lozinka
      POSTGRES_DB: epiljara
    ports:
      - "5432:5432"
    volumes:
      - epiljara-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epiljara"]
      interval: 10s
      timeout: 5s
      retries: 5

  osrm:
    image: osrm/osrm-backend:latest
    container_name: epiljara-osrm
    # --verbosity WARNING: bez ovoga osrm-routed pise svaki zahtjev na stdout,
    # a URL nosi koordinate kupaca i vozaca — isto curenje koje je Task 4
    # zatvorio na nasoj strani, samo jedan sloj nize. Greske i dalje prolaze.
    command: osrm-routed --algorithm mld --verbosity WARNING /data/bosnia-herzegovina-latest.osrm
    volumes:
      - ./osrm/data:/data:ro
    ports:
      - "5000:5000"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: epiljara-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=epiljara;Username=epiljara;Password=epiljara_dev_lozinka"
      Jwt__SigningKey: "dev-only-signing-key-change-in-production-min-32-bytes!!"
      Cors__Origins__0: "http://localhost:3000"
      Osrm__BaseUrl: "http://osrm:5000/"
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      osrm:
        condition: service_started

volumes:
  epiljara-pgdata:
