# Local development stack for the E piljara backend.
#   docker compose up -d postgres   # just the database (run the API from the IDE)
#   docker compose up -d            # database + API in containers
services:
  postgres:
    image: postgres:16-alpine
    container_name: epiljara-postgres
    environment:
      POSTGRES_USER: epiljara
      POSTGRES_PASSWORD: epiljara_dev_lozinka
      POSTGRES_DB: epiljara
    ports:
      - "5432:5432"
    volumes:
      - epiljara-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epiljara"]
      interval: 10s
      timeout: 5s
      retries: 5

  osrm:
    image: osrm/osrm-backend:latest
    container_name: epiljara-osrm
    # --verbosity WARNING: bez ovoga osrm-routed pise svaki zahtjev na stdout,
    # a URL nosi koordinate kupaca i vozaca — isto curenje koje je Task 4
    # zatvorio na nasoj strani, samo jedan sloj nize. Greske i dalje prolaze.
    command: osrm-routed --algorithm mld --verbosity WARNING /data/bosnia-herzegovina-latest.osrm
    volumes:
      - ./osrm/data:/data:ro
    ports:
      - "5000:5000"
    restart: unless-stopped

  # Sopstveni Nominatim, iz istog razloga kao osrm iznad: adrese kupaca prestaju
  # izlaziti iz nase infrastrukture. PRVO POKRETANJE UVOZI MAPU i traje desetinama
  # minuta — ne prekidati ga i ne ocekivati da servis odmah odgovara. Zahtjevi po
  # disku i memoriji i cijelo uputstvo: nominatim/README.md.
  nominatim:
    image: mediagis/nominatim:5.3
    container_name: epiljara-nominatim
    environment:
      PBF_URL: https://download.geofabrik.de/europe/bosnia-herzegovina-latest.osm.pbf
      # Bez diffova: baza se zamrzava (manja na disku), a osvjezavanje mape je ponovni
      # uvoz — isti pristup kao kod osrm-a.
      FREEZE: "true"
      UPDATE_MODE: none
      # Podrazumijevane vrijednosti imidza su za veliku masinu (maintenance_work_mem
      # 10GB, effective_cache_size 24GB). Ovo su vrijednosti za jedan izvod drzave na
      # razvojnoj masini; prilagoditi svojoj (vidi README).
      POSTGRES_SHARED_BUFFERS: 1GB
      POSTGRES_MAINTENANCE_WORK_MEM: 4GB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 4GB
    # Podrazumijevani shm_size (64M) je premalo za uvoz; dokumentacija imidza trazi
    # najmanje 1GB.
    shm_size: 1gb
    volumes:
      - epiljara-nominatim-data:/var/lib/postgresql/16/main
    ports:
      - "8080:8080"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: epiljara-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=epiljara;Username=epiljara;Password=epiljara_dev_lozinka"
      Jwt__SigningKey: "dev-only-signing-key-change-in-production-min-32-bytes!!"
      Cors__Origins__0: "http://localhost:3000"
      Osrm__BaseUrl: "http://osrm:5000/"
      Nominatim__BaseUrl: "http://nominatim:8080/"
      # Sopstvena instanca ne trazi jedan zahtjev u sekundi kao javna.
      Nominatim__ThrottleMs: "0"
    ports:
      - "5080:8080"
    # nominatim NIJE u depends_on namjerno: prvo pokretanje uvozi mapu desetinama
    # minuta, a API bi dotle cekao. Geokodiranje koje ne uspije vraca null i ekran
    # to podnosi, pa je bolje da API radi bez njega nego da ne krene.
    depends_on:
      postgres:
        condition: service_healthy
      osrm:
        condition: service_started

volumes:
  epiljara-pgdata:
  epiljara-nominatim-data:
